<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>AEM 7500 Mastery Guide</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#15171C"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
html,body{height:100%;margin:0}body{background:#15171C;color:#F2F4F8;font:16px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:grid;place-items:center;
  background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:32px 32px}
main{width:min(92vw,440px);background:#0F1115;border:1px solid #2F3440;border-radius:10px;padding:24px}
h1{font-size:17px;margin:0 0 4px}h1 b{color:#FF7A1A}p{color:#8B93A3;font-size:13.5px;margin:6px 0 16px}
label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8B93A3;margin-bottom:6px}
input{width:100%;box-sizing:border-box;font:inherit;padding:10px 12px;border-radius:6px;border:1px solid #2F3440;background:#15171C;color:#F2F4F8}
button{margin-top:12px;width:100%;font:700 15px inherit;padding:11px;border-radius:6px;border:0;background:#FF7A1A;color:#15171C;cursor:pointer}
input:focus-visible,button:focus-visible{outline:2px solid #5A9DFF;outline-offset:2px}
#msg{min-height:1.4em;color:#FF6B6B;font-size:13.5px;margin:10px 0 0}#msg.ok{color:#7BD88F}
</style></head><body><main>
<h1><b>&gt;&gt;</b> aem7500 --unlock</h1>
<p>Private study guide. Enter the passphrase once on this device; it is remembered here.</p>
<form id="f"><label for="p">Passphrase</label><input id="p" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
<button type="submit">Unlock</button><p id="msg" role="status" aria-live="polite"></p></form>
</main><script>
(function(){"use strict";const ITER=250000,KEY="aem7500-unlock-v1",msg=document.getElementById("msg");
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u))),unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let blob=null;const load=()=>blob?Promise.resolve(blob):fetch("app.enc").then(r=>{if(!r.ok)throw new Error("fetch");return r.arrayBuffer();}).then(b=>blob=new Uint8Array(b));
async function open(raw){const d=await load(),k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(16,28)},k,d.slice(28)));
  document.open();document.write(html);document.close();}
async function derive(pass){const d=await load(),base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass.normalize("NFKC")),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:d.slice(0,16),iterations:ITER,hash:"SHA-256"},base,256));}
let saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
if(saved){msg.className="ok";msg.textContent="Unlocking…";open(unb(saved)).catch(()=>{try{localStorage.removeItem(KEY);}catch(e){}msg.className="";msg.textContent="The guide was updated or the saved key is no longer valid. Enter the passphrase again.";});}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();msg.className="ok";msg.textContent="Checking…";
  try{const raw=await derive(document.getElementById("p").value.trim().toLowerCase());try{localStorage.setItem(KEY,b64(raw));}catch(e){}await open(raw);}
  catch(err){try{localStorage.removeItem(KEY);}catch(e){}msg.className="";msg.textContent=err&&err.message==="fetch"?"Could not load the guide. Check your connection and try again.":"That passphrase did not work. Check it and try again.";}});
})();
</script></body></html>
